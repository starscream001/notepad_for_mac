<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src 'self' about:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Notepad Mobile</title><link rel="stylesheet" href="style.css"></head><body>
<header><button id="library-toggle" class="icon" aria-label="Проекты" data-icon="panel"></button><img src="icon.png" width="36" height="36" alt="Лиса Notepad"><div class="brand">Notepad <small id="save-state" role="status">Локально</small></div><button id="add-note" class="icon" aria-label="Новая заметка" data-icon="plus"></button><button id="more" class="icon" aria-label="Действия" data-icon="more"></button></header>
<nav id="tabs" aria-label="Открытые заметки"></nav>
<main id="workspace"><aside id="sidebar"><div class="sidebar-head"><strong id="projects-title">Проекты</strong><button id="add-project" class="icon" aria-label="Создать проект" data-icon="plus"></button><button id="close-library" class="icon" aria-label="Закрыть проекты" data-icon="close"></button></div><div id="project-list"></div></aside><section id="editing"><div id="empty"><img src="icon.png" width="64" height="64" alt=""><h1 id="empty-title">Место для мыслей</h1><p id="empty-hint">Создайте заметку или выберите её в проектах.</p><button id="empty-new" class="primary">Новая заметка</button></div><div id="editor"></div></section><section id="preview" hidden><iframe id="rendered" title="Предпросмотр" sandbox=""></iframe></section></main>
<footer><span id="position"></span><label><span class="sr-only">Формат</span><select id="syntax" aria-label="Формат"><option value="auto">Авто</option><option value="text">Текст</option><option value="markdown">Markdown</option><option value="html">HTML</option><option value="sql">SQL</option><option value="kafka">Kafka</option><option value="json">JSON</option><option value="javascript">JavaScript</option><option value="python">Python</option><option value="css">CSS</option></select></label><button id="preview-toggle" class="icon" aria-label="Предпросмотр" aria-pressed="false" data-icon="preview"></button><button id="save" class="icon" aria-label="Сохранить локально" data-icon="save"></button></footer>
<dialog id="library-dialog" aria-label="Проекты"></dialog>
<dialog id="menu-dialog"><div class="dialog-head"><h2 id="actions-title">Действия</h2><button class="icon dismiss" aria-label="Закрыть" data-icon="close"></button></div><div class="menu-items"><button id="find">Найти в заметке</button><button id="rename-note">Переименовать заметку</button><button id="export-note">Поделиться файлом</button><button id="import-note">Открыть текстовый файл</button><button id="delete-note" class="danger">Удалить заметку</button><hr><button id="export-backup">Экспорт всех заметок</button><button id="import-backup">Импорт резервной копии</button></div><div class="preferences"><label id="theme-label">Тема<select id="theme"><option value="system">Системная</option><option value="light">Светлая</option><option value="dark">Тёмная</option></select></label><label>Интерфейс<select id="locale"><option value="ru">Русский</option><option value="en">English</option></select></label></div><p class="about">Notepad Mobile <span id="version"></span> · beta<br><a href="https://github.com/starscream001/notepad_for_mac" target="_blank" rel="noopener">Илья · starscream001</a> · <a href="https://t.me/Ilya_Manik" target="_blank" rel="noopener">Telegram</a><br><span id="offline-hint">Заметки на устройстве. Вход и синхронизация — следующий этап.</span></p></dialog>
<dialog id="name-dialog"><form id="name-form"><h2 id="name-title"></h2><label id="name-label" for="name-value">Название</label><input id="name-value" maxlength="80" required autocomplete="off"><p id="name-error" role="alert"></p><div class="dialog-actions"><button type="button" id="name-cancel">Отмена</button><button class="primary" type="submit" id="name-submit">Сохранить</button></div></form></dialog>
<dialog id="confirm-dialog"><h2 id="confirm-title"></h2><p id="confirm-text"></p><div class="dialog-actions"><button id="confirm-cancel">Отмена</button><button id="confirm-yes" class="danger">Удалить</button></div></dialog>
<input id="file-input" type="file" hidden><div id="notice" role="status" hidden></div><script type="module" src="app.js"></script></body></html>
