name: Build macOS app
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test document encoding, search and recovery
        run: swift run CoreChecks
      - name: Build universal app (Apple Silicon and Intel)
        env:
          UNIVERSAL: '1'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          ./scripts/build.sh
      - name: Upload ready-to-run application
        uses: actions/upload-artifact@v4
        with:
          name: Notepad-Mac-universal
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Notepad-Mac-universal
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Notepad Mac ${GITHUB_REF_NAME#v}" --generate-notes

  latest:
    name: Publish direct download
    # Release 0.2 is awaiting the final icon choice.
    if: false
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: latest-download
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Notepad-Mac-universal
          path: dist
      - name: Publish application with a permanent download link
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # An older run must not replace a newer application.
          HEAD_SHA="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$HEAD_SHA" != "$GITHUB_SHA" ]]; then
            echo "A newer commit is available; skipping this download update."
            exit 0
          fi
          cp dist/Notepad-Mac-*-universal.zip dist/Notepad-Mac-universal.zip
          (cd dist && sha256sum Notepad-Mac-universal.zip > Notepad-Mac-universal.zip.sha256)
          cat > release-notes.md <<EOF
          Готовое приложение для macOS 13+, Apple Silicon и Intel.

          Скачайте **Notepad-Mac-universal.zip**, распакуйте и перенесите **Notepad Mac.app** в **Программы**.

          Инструкция установки: https://github.com/$GH_REPO#установить-на-mac

          Исходники этой сборки: https://github.com/$GH_REPO/commit/$GITHUB_SHA
          EOF
          if gh release view latest >/dev/null 2>&1; then
            gh api "repos/$GH_REPO/git/refs/tags/latest" --method PATCH -f sha="$GITHUB_SHA" -F force=true
            gh release edit latest --title "Notepad Mac — скачать для macOS" --notes-file release-notes.md --prerelease
          else
            gh release create latest --target "$GITHUB_SHA" --title "Notepad Mac — скачать для macOS" --notes-file release-notes.md --prerelease
          fi
          gh release upload latest dist/Notepad-Mac-universal.zip dist/Notepad-Mac-universal.zip.sha256 --clobber

      - name: Publish numbered version with release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$HEAD_SHA" != "$GITHUB_SHA" ]]; then exit 0; fi
          archives=(dist/Notepad-Mac-*-universal.zip)
          VERSION="${archives[0]##*/}"
          VERSION="${VERSION#Notepad-Mac-}"
          VERSION="${VERSION%-universal.zip}"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG is already published; keeping its original files."
            exit 0
          fi
          gh api "repos/$GH_REPO/contents/RELEASE_NOTES.md?ref=$GITHUB_SHA" --jq '.content' | base64 --decode > version-notes.md
          gh release create "$TAG" "${archives[0]}" "${archives[0]}.sha256" --target "$GITHUB_SHA" --title "Notepad Mac $VERSION" --notes-file version-notes.md --latest
