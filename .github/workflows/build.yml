name: Build desktop applications
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Test and build universal app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test encodings, search, recovery and SQL syntax
        run: swift run CoreChecks
      - name: Build universal app (Apple Silicon and Intel)
        env:
          UNIVERSAL: '1'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          fi
          ./scripts/build.sh
      - name: Upload ready-to-run application
        uses: actions/upload-artifact@v4
        with:
          name: Notepad-Mac-universal
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 7
  desktop:
    name: Desktop · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
            artifact: Notepad-Windows
          - os: ubuntu-24.04
            target: --linux --x64
            artifact: Notepad-Linux
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Check version and file round trips
        run: |
          node -e "const fs=require('fs'); if(require('./package.json').version!==fs.readFileSync('../VERSION','utf8').trim()) process.exit(1)"
          npm test
      - name: Package installable application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist -- ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Publish GitHub Release
    if: (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || startsWith(github.ref, 'refs/tags/v')
    needs: [build, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-releases
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Notepad-Mac-universal
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: Notepad-*
          path: dist
          merge-multiple: true
      - name: Publish versioned releases, notes and downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/publish.sh
