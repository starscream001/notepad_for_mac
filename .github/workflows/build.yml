name: Build macOS app
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test document encoding, search and recovery
        run: swift run CoreChecks
      - name: Build universal app (Apple Silicon and Intel)
        env:
          UNIVERSAL: '1'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          ./scripts/build.sh
      - name: Upload ready-to-run application
        uses: actions/upload-artifact@v4
        with:
          name: Notepad-Mac-universal
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Notepad-Mac-universal
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Notepad Mac ${GITHUB_REF_NAME#v}" --generate-notes
