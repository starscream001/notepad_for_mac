name: Build macOS app
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Test and build universal app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test encodings, search, recovery and SQL syntax
        run: swift run CoreChecks
      - name: Build universal app (Apple Silicon and Intel)
        env:
          UNIVERSAL: '1'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          fi
          ./scripts/build.sh
      - name: Upload ready-to-run application
        uses: actions/upload-artifact@v4
        with:
          name: Notepad-Mac-universal
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 30
  publish:
    name: Publish GitHub Release
    if: (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-releases
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Notepad-Mac-universal
          path: dist
      - name: Publish versioned releases, notes and downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/publish.sh
